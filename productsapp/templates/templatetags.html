<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
        }

        .container {
            padding: 40px;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .price {
            color: #1e3a8a;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            font-size: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>My E-Commerce - Cart</h1>
    </div>

    <div class="container">

        <h2>Your Cart</h2>

        {% for product in products %}

        <div class="cart-item">
            <h3>{{ product.name }}</h3>
            <p class="price">₹{{ product.price }}</p>

<div style="margin-top: 15px;">
    <a href="{% url 'update_cart' product.id 'decrease' %}"
       style="padding: 8px 12px; background: #1e3a8a; color: white; text-decoration: none; border-radius: 5px;">
        −
    </a>

    <span style="margin: 0 15px; font-weight: bold;">
        {{ cart|get_item:product.id }}
    </span>

    <a href="{% url 'update_cart' product.id 'increase' %}"
       style="padding: 8px 12px; background: #1e3a8a; color: white; text-decoration: none; border-radius: 5px;">
        +
    </a>
</div>
        </div>

        {% empty %}

        <p class="empty">Your cart is empty.</p>

        {% endfor %}

        <a href="/" class="back-btn">Continue Shopping</a>

    </div>

</body>
</html>
